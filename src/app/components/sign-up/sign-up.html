<div class="login-page-wrapper">
  <div class="login-card">
    <h2>Create Account</h2>
    <p class="subtitle">Join TeamGrid management space today.</p>
    <form [formGroup]="signupForm" (ngSubmit)="onSignUp()">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input id="name" type="text" formControlName="name" placeholder="John Doe"
          [ngClass]="{'input-error':signupForm.get('name')?.touched && signupForm.get('name')?.invalid}" />

      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" placeholder="your-name@company.com"
          [ngClass]="{'input-error':signupForm.get('email')?.touched && signupForm.get('email')?.invalid}" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="....."
          [ngClass]="{'input-error':signupForm.get('password')?.touched && signupForm.get('password')?.invalid}" />
      </div>
      <button type="submit" class="submit-btn" [disabled]="signupForm.invalid">Sign Up</button>
      <p class="switch-page-text">Already have an account? <a routerLink="/login">Login</a></p>
    </form>
  </div>
</div>
