<div class="about-container">
  <div class="about-card">
    <div class="about-header">
      <h2>About TeamGrid ERP</h2>
      <p class="subtitle">Internal Enterprise Resources Planning Dashboard</p>
    </div>
    <div class="about-body">
      <p class="description"><strong>TeamGrid</strong></p>
      <div class="metadata-section">
        <h3>System Specifications</h3>
        <div class="meta-row">
          <span class="meta-label">System Version:</span>
          <span class="meta-value-version-tag">{{systemVersion}}</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Developer Account:</span>
          <span class="meta-value-developer-name">{{developerAccount}}</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Build Status:</span>
          <span class="meta-value">{{buildStatus}}</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">Release Date:</span>
          <span class="meta-value">{{releaseDate}}</span>
        </div>

      </div>
    </div>

  </div>

</div>
